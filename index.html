<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>How Radar Sees</title>
  <meta name="description" content="An interactive essay on how radar and synthetic aperture radar work — and whether Starlink could be a secret radar constellation. 42 interactive figures." />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="How Radar Sees" />
  <meta property="og:description" content="An interactive essay on how radar and synthetic aperture radar work — and whether Starlink could be a secret radar constellation. 42 interactive figures." />
  <meta property="og:image" content="https://how-radar-sees.pages.dev/og.png" />
  <meta property="og:url" content="https://how-radar-sees.pages.dev/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="How Radar Sees" />
  <meta name="twitter:description" content="How radar and SAR work — and whether Starlink could be a secret radar constellation." />
  <meta name="twitter:image" content="https://how-radar-sees.pages.dev/og.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="site-header">
    <svg class="site-header__scene" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="hSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#03050b"/>
          <stop offset="0.45" stop-color="#060e1c"/>
          <stop offset="0.8" stop-color="#0a1d33"/>
          <stop offset="1" stop-color="#0c2742"/>
        </linearGradient>
        <radialGradient id="hNebula" cx="0.72" cy="0.12" r="0.55">
          <stop offset="0" stop-color="#24447a" stop-opacity="0.42"/>
          <stop offset="1" stop-color="#24447a" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="hEarth" cx="0.4" cy="0.66" r="0.85">
          <stop offset="0" stop-color="#245f96"/>
          <stop offset="0.4" stop-color="#0f3f66"/>
          <stop offset="0.75" stop-color="#082138"/>
          <stop offset="1" stop-color="#040f1d"/>
        </radialGradient>
        <linearGradient id="hArray" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#20487f"/>
          <stop offset="1" stop-color="#0a1c39"/>
        </linearGradient>
        <linearGradient id="hBeam" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9fceff" stop-opacity="0.6"/>
          <stop offset="0.55" stop-color="#7fb6f2" stop-opacity="0.16"/>
          <stop offset="1" stop-color="#7fb6f2" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="hFoot" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#d4ecff" stop-opacity="1"/>
          <stop offset="0.5" stop-color="#8fc4ff" stop-opacity="0.45"/>
          <stop offset="1" stop-color="#8fc4ff" stop-opacity="0"/>
        </radialGradient>
        <filter id="hBlurBig" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="18"/></filter>
        <filter id="hBlurMed" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
        <filter id="hBlurSm"><feGaussianBlur stdDeviation="2"/></filter>
        <clipPath id="hEarthClip"><circle cx="600" cy="1620" r="1240"/></clipPath>
      </defs>

      <rect width="1200" height="640" fill="url(#hSky)"/>
      <rect width="1200" height="640" fill="url(#hNebula)"/>

      <!-- stars -->
      <g fill="#cfe0f5">
        <circle cx="90" cy="70" r="1.1" opacity="0.7"/><circle cx="180" cy="130" r="0.8" opacity="0.5"/>
        <circle cx="250" cy="60" r="1.3" opacity="0.85"/><circle cx="340" cy="150" r="0.7" opacity="0.45"/>
        <circle cx="420" cy="90" r="1" opacity="0.6"/><circle cx="520" cy="50" r="0.9" opacity="0.7"/>
        <circle cx="150" cy="220" r="0.9" opacity="0.5"/><circle cx="60" cy="300" r="1.1" opacity="0.6"/>
        <circle cx="610" cy="120" r="0.8" opacity="0.5"/><circle cx="700" cy="70" r="1.2" opacity="0.8"/>
        <circle cx="1120" cy="90" r="1.1" opacity="0.75"/><circle cx="1050" cy="160" r="0.8" opacity="0.5"/>
        <circle cx="990" cy="60" r="1" opacity="0.65"/><circle cx="1160" cy="230" r="0.9" opacity="0.55"/>
        <circle cx="880" cy="110" r="0.7" opacity="0.45"/><circle cx="300" cy="250" r="0.8" opacity="0.5"/>
        <circle cx="470" cy="200" r="0.7" opacity="0.4"/><circle cx="770" cy="220" r="0.8" opacity="0.5"/>
        <circle cx="1090" cy="330" r="0.8" opacity="0.45"/><circle cx="40" cy="160" r="0.8" opacity="0.5"/>
        <circle cx="210" cy="330" r="0.7" opacity="0.4"/><circle cx="560" cy="270" r="0.7" opacity="0.4"/>
      </g>
      <!-- a few bright stars with a soft glow -->
      <g fill="#bcd8ff" filter="url(#hBlurSm)" opacity="0.7">
        <circle cx="250" cy="66" r="3"/><circle cx="702" cy="58" r="2.8"/><circle cx="1052" cy="120" r="2.6"/><circle cx="150" cy="188" r="2.4"/>
      </g>
      <g fill="#eaf3ff">
        <circle cx="250" cy="66" r="1.6"/><circle cx="702" cy="58" r="1.5"/><circle cx="1052" cy="120" r="1.4"/><circle cx="150" cy="188" r="1.3"/><circle cx="470" cy="150" r="1.2"/>
      </g>

      <!-- faint orbit arc -->
      <path d="M -40 300 Q 600 96 1240 300" fill="none" stroke="#4a7fb5" stroke-opacity="0.22" stroke-width="1.5" stroke-dasharray="2 10"/>

      <!-- Earth: glowing atmosphere + body + city lights -->
      <g>
        <circle cx="600" cy="1620" r="1272" fill="none" stroke="#6fc8ff" stroke-width="40" stroke-opacity="0.42" filter="url(#hBlurBig)"/>
        <ellipse cx="1010" cy="482" rx="380" ry="150" fill="#ffab5e" opacity="0.13" filter="url(#hBlurBig)"/>
        <circle cx="600" cy="1620" r="1250" fill="none" stroke="#bfe8ff" stroke-width="7" stroke-opacity="0.75" filter="url(#hBlurMed)"/>
        <circle cx="600" cy="1620" r="1240" fill="url(#hEarth)"/>
        <circle cx="600" cy="1620" r="1240" fill="none" stroke="#a6dbff" stroke-width="1.4" stroke-opacity="0.65"/>
        <g clip-path="url(#hEarthClip)" fill="#ffd79a">
          <circle cx="180" cy="470" r="1.2" opacity="0.5"/><circle cx="240" cy="500" r="1" opacity="0.4"/>
          <circle cx="300" cy="460" r="1.4" opacity="0.6"/><circle cx="340" cy="520" r="0.9" opacity="0.4"/>
          <circle cx="220" cy="540" r="1.1" opacity="0.5"/><circle cx="400" cy="482" r="1.2" opacity="0.55"/>
          <circle cx="440" cy="540" r="0.9" opacity="0.4"/><circle cx="160" cy="520" r="1" opacity="0.45"/>
          <circle cx="360" cy="560" r="1.1" opacity="0.5"/><circle cx="280" cy="590" r="1" opacity="0.4"/>
          <circle cx="480" cy="504" r="1" opacity="0.45"/><circle cx="120" cy="486" r="0.9" opacity="0.4"/>
          <circle cx="520" cy="548" r="1.1" opacity="0.5"/><circle cx="205" cy="430" r="1" opacity="0.45"/>
          <circle cx="420" cy="600" r="0.9" opacity="0.4"/><circle cx="322" cy="502" r="1.2" opacity="0.55"/>
        </g>
      </g>

      <!-- radar beam + scan footprint on the surface -->
      <g>
        <polygon points="776,291 802,297 638,456 510,444" fill="url(#hBeam)"/>
        <ellipse cx="574" cy="450" rx="98" ry="22" fill="url(#hFoot)"/>
        <ellipse cx="574" cy="450" rx="30" ry="7" fill="none" stroke="#d8eeff" stroke-opacity="0.75" stroke-width="1.5"/>
        <ellipse cx="574" cy="450" rx="60" ry="14" fill="none" stroke="#bfe0ff" stroke-opacity="0.4" stroke-width="1.5"/>
        <ellipse cx="574" cy="450" rx="90" ry="20.5" fill="none" stroke="#bfe0ff" stroke-opacity="0.2" stroke-width="1.2"/>
      </g>

      <!-- Starlink satellite: compact bus + one long solar array (deployed shape) -->
      <g stroke-linejoin="round">
        <!-- solar array (single long panel) -->
        <polygon points="772,242 802,258 1047,108 1017,92" fill="url(#hArray)" stroke="#3f6196" stroke-opacity="0.75" stroke-width="1"/>
        <g stroke="#4d78b0" stroke-opacity="0.55" stroke-width="0.9">
          <line x1="802.6" y1="223.3" x2="832.6" y2="239.3"/>
          <line x1="833.3" y1="204.5" x2="863.3" y2="220.5"/>
          <line x1="863.9" y1="185.8" x2="893.9" y2="201.8"/>
          <line x1="894.5" y1="167" x2="924.5" y2="183"/>
          <line x1="925.1" y1="148.3" x2="955.1" y2="164.3"/>
          <line x1="955.8" y1="129.5" x2="985.8" y2="145.5"/>
          <line x1="986.4" y1="110.8" x2="1016.4" y2="126.8"/>
          <line x1="782" y1="247.3" x2="1027" y2="97.3"/>
          <line x1="792" y1="252.7" x2="1037" y2="102.7"/>
        </g>
        <polygon points="1017,92 1047,108 1043,110 1013,94" fill="#bcd6f5" opacity="0.5"/>
        <!-- bus: top + front faces (compact, dark) -->
        <polygon points="768,250 804,260 816,250 780,240" fill="#363c48"/>
        <polygon points="768,250 804,260 804,290 768,280" fill="#2b303a"/>
        <!-- phased-array antenna on the Earth-facing underside -->
        <polygon points="772,281 804,290 804,298 772,289" fill="#4a6fbf" stroke="#7f97ba" stroke-opacity="0.5" stroke-width="0.6"/>
      </g>
    </svg>
    <div class="wrap">
      <p class="kicker">An interactive essay</p>
      <h1>How Radar Sees</h1>
      <p class="site-header__sub">— and why Starlink might be watching</p>
    </div>
  </header>
  <main class="prose" id="app"></main>
  <script type="module" src="/src/pages/index.js"></script>
</body>
</html>
