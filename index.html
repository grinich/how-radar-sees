<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>How Radar Sees</title>
  <meta name="description" content="An interactive essay on how radar and synthetic aperture radar work — and whether Starlink could be a secret radar constellation. 42 interactive figures." />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="How Radar Sees" />
  <meta property="og:description" content="An interactive essay on how radar and synthetic aperture radar work — and whether Starlink could be a secret radar constellation. 42 interactive figures." />
  <meta property="og:image" content="https://how-radar-sees.pages.dev/og.png" />
  <meta property="og:url" content="https://how-radar-sees.pages.dev/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="How Radar Sees" />
  <meta name="twitter:description" content="How radar and SAR work — and whether Starlink could be a secret radar constellation." />
  <meta name="twitter:image" content="https://how-radar-sees.pages.dev/og.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="site-header">
    <svg class="site-header__scene" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="hSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#05070d"/>
          <stop offset="0.5" stop-color="#0a1421"/>
          <stop offset="1" stop-color="#0e2337"/>
        </linearGradient>
        <radialGradient id="hEarth" cx="0.5" cy="1.05" r="0.95">
          <stop offset="0" stop-color="#1e5f95"/>
          <stop offset="0.4" stop-color="#0e3355"/>
          <stop offset="0.78" stop-color="#08192d"/>
          <stop offset="1" stop-color="#050f1d"/>
        </radialGradient>
        <linearGradient id="hPanel" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#59708f"/>
          <stop offset="1" stop-color="#2b3550"/>
        </linearGradient>
        <linearGradient id="hArray" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#1d4680"/>
          <stop offset="1" stop-color="#0a1c39"/>
        </linearGradient>
        <linearGradient id="hBeam" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7fb6f2" stop-opacity="0.42"/>
          <stop offset="1" stop-color="#7fb6f2" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="hFoot" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#8fc4ff" stop-opacity="0.9"/>
          <stop offset="1" stop-color="#8fc4ff" stop-opacity="0"/>
        </radialGradient>
        <filter id="hGlow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
      </defs>

      <rect width="1200" height="640" fill="url(#hSky)"/>

      <!-- stars -->
      <g fill="#cfe0f5">
        <circle cx="90" cy="70" r="1.1" opacity="0.7"/><circle cx="180" cy="130" r="0.8" opacity="0.5"/>
        <circle cx="250" cy="60" r="1.3" opacity="0.85"/><circle cx="340" cy="150" r="0.7" opacity="0.45"/>
        <circle cx="420" cy="90" r="1" opacity="0.6"/><circle cx="520" cy="50" r="0.9" opacity="0.7"/>
        <circle cx="150" cy="220" r="0.9" opacity="0.5"/><circle cx="60" cy="300" r="1.1" opacity="0.6"/>
        <circle cx="610" cy="120" r="0.8" opacity="0.5"/><circle cx="700" cy="70" r="1.2" opacity="0.8"/>
        <circle cx="1120" cy="90" r="1.1" opacity="0.75"/><circle cx="1050" cy="160" r="0.8" opacity="0.5"/>
        <circle cx="990" cy="60" r="1" opacity="0.65"/><circle cx="1160" cy="230" r="0.9" opacity="0.55"/>
        <circle cx="880" cy="110" r="0.7" opacity="0.45"/><circle cx="300" cy="250" r="0.8" opacity="0.5"/>
        <circle cx="470" cy="200" r="0.7" opacity="0.4"/><circle cx="770" cy="220" r="0.8" opacity="0.5"/>
        <circle cx="1090" cy="330" r="0.8" opacity="0.45"/><circle cx="40" cy="160" r="0.8" opacity="0.5"/>
        <circle cx="210" cy="330" r="0.7" opacity="0.4"/><circle cx="560" cy="270" r="0.7" opacity="0.4"/>
      </g>

      <!-- faint orbit arc -->
      <path d="M -40 300 Q 600 90 1240 300" fill="none" stroke="#4a7fb5" stroke-opacity="0.28" stroke-width="1.5" stroke-dasharray="2 9"/>

      <!-- Earth limb -->
      <g>
        <ellipse cx="600" cy="470" rx="720" ry="150" fill="#5db4ff" opacity="0.22" filter="url(#hGlow)"/>
        <circle cx="600" cy="1520" r="1120" fill="url(#hEarth)"/>
        <path d="M -40 405 Q 600 356 1240 405" fill="none" stroke="#8fd0ff" stroke-opacity="0.55" stroke-width="2"/>
      </g>

      <!-- radar beam + scan footprint on the surface -->
      <g>
        <polygon points="798,244 824,244 636,452 512,440" fill="url(#hBeam)"/>
        <ellipse cx="574" cy="446" rx="86" ry="20" fill="url(#hFoot)"/>
        <ellipse cx="574" cy="446" rx="30" ry="7" fill="none" stroke="#bfe0ff" stroke-opacity="0.55" stroke-width="1.5"/>
        <ellipse cx="574" cy="446" rx="58" ry="13.5" fill="none" stroke="#bfe0ff" stroke-opacity="0.3" stroke-width="1.5"/>
      </g>

      <!-- Starlink satellite: flat chassis (phased-array antenna) + one long solar array -->
      <g stroke-linejoin="round">
        <!-- solar array (single long wing) -->
        <polygon points="884,216 898,252 1048,66 1034,30" fill="url(#hArray)" stroke="#3f6196" stroke-opacity="0.75" stroke-width="1"/>
        <g stroke="#4d78b0" stroke-opacity="0.55" stroke-width="0.9">
          <line x1="902.8" y1="192.8" x2="916.8" y2="228.8"/>
          <line x1="921.5" y1="169.5" x2="935.5" y2="205.5"/>
          <line x1="940.3" y1="146.3" x2="954.3" y2="182.3"/>
          <line x1="959" y1="123" x2="973" y2="159"/>
          <line x1="977.8" y1="99.8" x2="991.8" y2="135.8"/>
          <line x1="996.5" y1="76.5" x2="1010.5" y2="112.5"/>
          <line x1="1015.3" y1="53.3" x2="1029.3" y2="89.3"/>
          <line x1="891" y1="234" x2="1041" y2="48"/>
        </g>
        <polygon points="1034,30 1048,66 1044,68 1030,32" fill="#bcd6f5" opacity="0.5"/>
        <!-- phased-array antenna panel (faces Earth) -->
        <polygon points="720,236 884,216 898,252 734,272" fill="url(#hPanel)" stroke="#8ea6c6" stroke-opacity="0.7" stroke-width="1"/>
        <g stroke="#9fb4d2" stroke-opacity="0.5" stroke-width="0.8">
          <line x1="747.3" y1="232.7" x2="761.3" y2="268.7"/>
          <line x1="774.6" y1="229.3" x2="788.6" y2="265.3"/>
          <line x1="802" y1="226" x2="816" y2="262"/>
          <line x1="829.3" y1="222.7" x2="843.3" y2="258.7"/>
          <line x1="856.6" y1="219.3" x2="870.6" y2="255.3"/>
          <line x1="727" y1="254" x2="891" y2="234"/>
        </g>
        <!-- avionics bus on the antenna face -->
        <polygon points="812,232 852,227 856,241 816,246" fill="#e6ecf6" opacity="0.85"/>
      </g>
    </svg>
    <div class="wrap">
      <p class="kicker">An interactive essay</p>
      <h1>How Radar Sees</h1>
      <p class="site-header__sub">— and why Starlink might be watching</p>
    </div>
  </header>
  <main class="prose" id="app"></main>
  <script type="module" src="/src/pages/index.js"></script>
</body>
</html>
